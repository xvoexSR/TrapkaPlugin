name: TrapkaPlugin
version: 1.0.0
main: com.trapka.plugin.TrapkaPlugin
api-version: 1.19
author: TrapkaDev
description: Предмет "Трапка" - ставит временную PvP-ловушку из обсидиана, чёрного бетона и чёрного стекла

commands:
  trapka:
    description: Выдать предмет Трапка
    usage: /trapka give [игрок]
    permission: trapka.admin

permissions:
  trapka.admin:
    description: Доступ к команде /trapka give
    default: op
  trapka.use:
    description: Разрешение использовать Трапку
    default: true
